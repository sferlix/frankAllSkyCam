########################################
# generateExtraData.py
# configuration file - generateExtraData.conf
#
# please adjust according to your needs.
# this file is independent from the main frankAllSkyCam config.txt,
# on purpose - see the comment at the top of generateExtraData.py
########################################

[meteo]
# if False, no weather station is queried at all (getMeteoStationData()/
# getDavisVantageProData() return immediately, no network call) - use this
# instead of commenting code out if you don't have a weather station.
enabled = True

# weather station JSON endpoint - either your local device
# (e.g. http://192.168.1.100/script/1/data) or a published feed
station_url = http://192.168.1.100/script/1/data

[ftp]
# these parameters are only needed if you want to send your WS90 weather
# station data to an FTP repository (e.g. to publish it on a website).
# if you don't need that, leave enabled = False and ignore the rest -
# a failed/unconfigured/disabled upload never blocks the on-image weather
# text.
enabled = False
host = your_server_here.com
user = your_username
pass = your_password
upload_path = /your_folder/ws90_data.json

[dew_heater]
# switches a dew heater on/off based on (internal temp - dew point), to
# prevent condensation on the lens/dome. Reuses whichever temp/dewpoint
# readings getData() already fetched for the watermark text - no extra
# sensor polling.
enabled = False

# how the heater is actually switched: "shelly" (a Shelly relay, over the
# network) or "gpio" (a relay wired directly to a Raspberry Pi GPIO pin)
method = shelly

# turn the heater ON when (internal temp - dew point) drops below this
# margin (deg C) - i.e. condensation risk is close; OFF once safely above it
margin_c = 10.0

# used only when method = shelly - the device with the relay. This may or
# may not be the same device you use for a temperature reading elsewhere
# in this file - some installations use one Shelly for both, others use
# separate devices.
shelly_ip = 192.168.1.54

# used only when method = gpio
gpio_pin = 17
# relay polarity: False = active-high (a HIGH signal turns the heater on -
# the default, matching this installation's existing GPIO convention).
# Set True if your relay board is active-low (a LOW signal turns it on) -
# getting this backwards runs the heater exactly inverted.
gpio_active_low = False
